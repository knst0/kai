[package]
name = "kai-fansubs"
version = "0.1.0"
description = "Rust client for fansubs.ru — anime subtitle database"
edition.workspace = true
license.workspace = true
repository = "https://github.com/sekiju/kai/tree/main/kai-fansubs"

[features]
serde = ["dep:serde"]

[dependencies]
encoding_rs = "0.8"
reqwest.workspace = true
scraper = "0.25"
serde = { workspace = true, optional = true }
thiserror.workspace = true
tower.workspace = true

[dev-dependencies]
tokio.workspace = true

[[example]]
name = "catalog"
path = "examples/catalog.rs"

[[example]]
name = "media"
path = "examples/media.rs"

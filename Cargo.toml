[workspace]
members = ["kai-fansubs", "kai-mangalib"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
encoding_rs = "0.8"
reqwest = "0.13"
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "rt", "macros"] }
tower = { version = "0.5", features = ["limit", "buffer", "util"] }
